<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>404</title>
    <style>
      :root { color: #332b22; background: #dfcdb4; font-family: system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.25rem; background: radial-gradient(circle at 50% 25%, #faf6ed 0 15%, transparent 48%), #dfcdb4; }
      main { width: min(100%, 39rem); padding: clamp(2rem, 7vw, 4.5rem); border: 1px solid #a19477; border-radius: 1rem; outline: 1px solid #a19477; outline-offset: -.55rem; background: #faf6ed; text-align: center; box-shadow: 0 1.25rem 3rem rgb(51 43 34 / 14%); animation: arrive 900ms cubic-bezier(.2, .75, .25, 1) both; }
      .ornament { color: #a96033; font: 2rem/1 Georgia, serif; }
      .code { margin: 1rem 0 0; color: #a96033; font: 700 .9rem/1.2 system-ui, sans-serif; letter-spacing: .18em; }
      h1 { margin: .45rem 0 1rem; color: #5d5738; font: 400 clamp(2.1rem, 8vw, 3.6rem)/1.08 Georgia, serif; }
      p { margin: .7rem auto; max-width: 30rem; }
      #countdown { color: #5d5738; font-family: Georgia, serif; }
      a { display: inline-block; margin-top: 1.1rem; padding: .7rem 1.2rem; border-radius: .4rem; background: #5d5738; color: #faf6ed; text-decoration: none; }
      a:hover { background: #332b22; }
      a:focus-visible { outline: 2px solid #a96033; outline-offset: 4px; }
      .progress { height: .3rem; margin: 1.75rem auto 0; overflow: hidden; border-radius: 1rem; background: #dfcdb4; }
      .progress::after { content: ''; display: block; width: 100%; height: 100%; background: #a96033; transform-origin: left; animation: countdown 5s linear forwards; }
      @keyframes arrive { from { opacity: 0; transform: translateY(1rem) scale(.985); } to { opacity: 1; transform: none; } }
      @keyframes countdown { to { transform: scaleX(0); } }
      @media (prefers-reduced-motion: reduce) { main, .progress::after { animation: none; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="not-found-title">
      <div class="ornament" aria-hidden="true">❦</div>
      <p class="code">404</p>
      <h1 id="not-found-title"></h1>
      <p id="message"></p>
      <p id="countdown" aria-live="polite"></p>
      <a id="return-link" href="/"></a>
      <div class="progress" aria-hidden="true"></div>
    </main>
    <script>
      const weddingPath = location.pathname.toLowerCase().startsWith('/wedding') || new URLSearchParams(location.search).has('wedding')
      let target = weddingPath ? '/wedding/' : '/'
      let copy
      let seconds = 5

      function updateCountdown() {
        if (copy) document.querySelector('#countdown').textContent = copy.countdown.replace('{seconds}', seconds)
      }

      Promise.any([
        fetch('/wedding/404-content.json').then((response) => response.ok ? response.json() : Promise.reject()),
        fetch('/404-content.json').then((response) => response.ok ? response.json() : Promise.reject())
      ]).then((content) => {
        copy = weddingPath ? content.wedding : content.portfolio
        target = copy.target
        document.documentElement.lang = copy.language
        document.title = copy.pageTitle
        document.querySelector('#not-found-title').textContent = copy.heading
        document.querySelector('#message').textContent = copy.message
        document.querySelector('#return-link').textContent = copy.link
        document.querySelector('#return-link').href = target
        updateCountdown()
      })

      const timer = window.setInterval(() => {
        seconds -= 1
        updateCountdown()
        if (seconds <= 0) window.clearInterval(timer)
      }, 1000)
      window.setTimeout(() => location.replace(target), 5000)
    </script>
  </body>
</html>
